# Hyperparameters — train-from-scratch for LS-YOLO DPU version (Hardswish + SE-ECA)
# Secondary objective: increase robustness against "domain gap" (different sensors/lighting/rotation)
# when deploying on KV260, ASSUMING the input is still top-down imagery (UAV/satellite).
# CANNOT compensate for major differences (e.g., ground-level webcams) — only helps when the domain is similar.

lr0: 0.01              # scratch (train from scratch, weights '')
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

# ── Photometric: relaxed to be robust against exposure/color differences of deployment sensors ──
hsv_h: 0.02            # (default 0.015) — slight color tone shift
hsv_s: 0.7            # saturation
hsv_v: 0.5            # (default 0.4) — most important: robust against different brightness/exposure

# ── Geometric: landslides viewed top-down are rotation/flip invariant (sync with hyp.finetune-uav) ──
degrees: 10.0          # rotate ±10° (UAV/satellite take photos from many directions)
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.5            # vertical flip is OK with top-down images
fliplr: 0.5

mosaic: 1.0
mixup: 0.1             # (default 0.0) — a little mixup helps generalize better
copy_paste: 0.0
